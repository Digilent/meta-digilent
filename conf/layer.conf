# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# BBFILES_DYNAMIC += "xilinx:${LAYERDIR}/dynamic-layers/xilinx/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-digilent"
BBFILE_PATTERN_meta-digilent = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-digilent = "6"

LAYERDEPENDS_meta-digilent = "core"
LAYERSERIES_COMPAT_meta-digilent = "scarthgap"

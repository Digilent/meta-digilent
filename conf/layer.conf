# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-digilent"
BBFILE_PATTERN_meta-digilent = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-digilent = "7"

LAYERDEPENDS_meta-digilent = "meta-nile meta-digilent-bsp"
LAYERSERIES_COMPAT_meta-digilent = "scarthgap"
